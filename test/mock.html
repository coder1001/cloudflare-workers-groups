<!doctype html>
<meta charset="utf-8" />
<title>Mock: Workers &amp; Pages</title>
<style>
  body { font: 14px system-ui; margin: 24px; background: #fff; color: #1d1d1f; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
  .wrap { max-width: 900px; }
</style>

<div class="wrap">
  <h1>Workers &amp; Pages</h1>
  <table>
    <thead><tr><th>Name</th><th>Typ</th><th>Zuletzt</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <div id="list-div" style="display:none;flex-direction:column"></div>
  <!-- wie im echten Dashboard: Liste und Pagination als Geschwister -->
  <div id="cards-wrap" style="display:none;flex-direction:column;gap:16px">
    <ul id="list-cards" class="list-none! m-0 grid gap-4"></ul>
    <div id="pager" style="display:flex;gap:8px;align-items:center">
      <button>Zurück</button><span>Seite 1 von 2</span><button>Weiter</button>
    </div>
  </div>
</div>

<script>
  // --- chrome.storage-Shim (In-Memory), damit die Content-Skripte laufen ---
  // localStorage-backed, damit Persistenz ueber Reload testbar ist
  const mem = JSON.parse(localStorage.getItem('__mem') || '{}');
  const persist = () => localStorage.setItem('__mem', JSON.stringify(mem));
  const listeners = [];
  window.chrome = {
    runtime: { lastError: null },
    storage: {
      sync: {
        get(keys, cb) {
          let out = {};
          if (keys === null) out = { ...mem };
          else for (const k of [].concat(keys)) if (k in mem) out[k] = mem[k];
          cb(out);
        },
        set(obj, cb) {
          const changes = {};
          for (const [k, v] of Object.entries(obj)) {
            changes[k] = { oldValue: mem[k], newValue: v };
            mem[k] = v;
          }
          persist();
          cb && cb();
          listeners.forEach((l) => l(changes, "sync"));
        },
        clear(cb) { for (const k of Object.keys(mem)) delete mem[k]; persist(); cb && cb(); },
      },
      // storage.local fuer den Projektcache – eigener Speicher, wie im Original
      local: {
        get(keys, cb) {
          const loc = JSON.parse(localStorage.getItem("__local") || "{}");
          let out = {};
          if (keys === null) out = { ...loc };
          else for (const k of [].concat(keys)) if (k in loc) out[k] = loc[k];
          cb(out);
        },
        set(obj, cb) {
          const loc = JSON.parse(localStorage.getItem("__local") || "{}");
          Object.assign(loc, obj);
          localStorage.setItem("__local", JSON.stringify(loc));
          cb && cb();
        },
        clear(cb) { localStorage.removeItem("__local"); cb && cb(); },
      },
      onChanged: { addListener: (l) => listeners.push(l) },
    },
  };

  const ACC = location.pathname.split("/")[1];
  const PARAMS = new URLSearchParams(location.search);

  // Schalter als Cookie weiterreichen, damit der Server sie bei den
  // API-Aufrufen der Erweiterung sieht
  document.cookie = "cfwg_demo=" + (PARAMS.get("demo") ? "1" : "0") + ";path=/";
  document.cookie = "cfwg_slow=" + (PARAMS.get("slow") ? "1" : "0") + ";path=/";

  // ?trace=1 schreibt den Ansichtszustand ab dem ersten Moment mit - sonst ist
  // die Ladephase vorbei, bevor man von aussen hineinschauen kann.
  if (PARAMS.get("trace")) {
    const start = Date.now();
    window.__trace = [];
    const merke = () => {
      const bar = document.querySelector('[data-cfwg="toolbar"]');
      const prog = document.querySelector("[data-cfwg-progress]");
      const liste = document.getElementById("list-cards");
      const zeile = {
        t: Date.now() - start,
        leiste: bar ? bar.querySelector(".cfwg-stats")?.textContent : null,
        balken: !prog || !prog.classList.contains("cfwg-progress-on")
          ? "aus"
          : prog.classList.contains("cfwg-progress-unbestimmt")
          ? "unbestimmt"
          : prog.querySelector(".cfwg-progress-fill").style.width,
        eigeneListe: !!document.querySelector('[data-cfwg="fulllist"]'),
        header: document.querySelectorAll('[data-cfwg="header"]').length,
        originalSichtbar: liste ? getComputedStyle(liste).display !== "none" : null,
      };
      const letzte = window.__trace[window.__trace.length - 1];
      const ohneZeit = (x) => JSON.stringify({ ...x, t: 0 });
      if (!letzte || ohneZeit(letzte) !== ohneZeit(zeile)) window.__trace.push(zeile);
    };
    setInterval(merke, 100);
    merke();
  }

  // ?demo=1 setzt einen vorzeigbaren Zustand fuer Screenshots – bewusst mit
  // erfundenen Projektnamen, damit nichts Echtes im Store landet.
  if (PARAMS.get("demo")) {
    const demo = {
      groups: [
        { id: "g1", name: "Kundenprojekte", color: "#f6821f" },
        { id: "g2", name: "Interne Tools", color: "#0051c3" },
        { id: "g3", name: "Spielwiese", color: "#00a86b" },
      ],
      ui: { collapsed: { g3: true }, enabled: true, allPages: true },
    };
    demo["assign:" + ACC] = {
      "worker/shop-api": "g1", "pages/shop-web": "g1", "worker/checkout-hook": "g1",
      "worker/monitoring": "g2", "worker/cron-runner": "g2", "pages/docs-site": "g2",
      "worker/image-resizer": "g3", "worker/sandbox-test": "g3",
    };
    localStorage.setItem("__mem", JSON.stringify(demo));
    // mem wurde oben schon gelesen – sonst greift der Demo-Zustand erst beim
    // naechsten Laden, und der Screenshot zeigt eine leere Gruppierung.
    Object.assign(mem, demo);

    document.querySelector(".wrap").style.maxWidth = "1180px";
  }
  const PROJECTS = PARAMS.get("demo")
    ? [
        ["shop-api", "worker"], ["shop-web", "pages"],
        ["checkout-hook", "worker"], ["monitoring", "worker"],
        ["cron-runner", "worker"], ["docs-site", "pages"],
        ["image-resizer", "worker"], ["sandbox-test", "worker"],
      ]
    : [
        ["shop-a-api", "worker"], ["shop-a-web", "pages"],
        ["shop-b-api", "worker"], ["shop-b-web", "pages"],
        ["monitoring", "worker"], ["cron-runner", "worker"],
        ["docs-site", "pages"], ["image-resizer", "worker"],
      ];

  // ?layout=div rendert dieselbe Liste als Flex-Container statt als Tabelle
  const LAYOUT = new URLSearchParams(location.search).get("layout") || "table";
  const DIV_LAYOUT = LAYOUT === "div";
  const CARD_LAYOUT = LAYOUT === "cards";
  const tbody = document.getElementById("list");
  const divList = document.getElementById("list-div");
  const cardList = document.getElementById("list-cards");
  const host = CARD_LAYOUT ? cardList : DIV_LAYOUT ? divList : tbody;

  if (DIV_LAYOUT || CARD_LAYOUT) {
    document.querySelector("table").style.display = "none";
  }
  if (DIV_LAYOUT) divList.style.display = "flex";
  if (CARD_LAYOUT) {
    document.getElementById("cards-wrap").style.display = "flex";
    cardList.style.display = "grid";
    cardList.style.cssText += ";list-style:none;margin:0;padding:0;gap:16px";
  }

  window.__render = (projects) => {
    host.innerHTML = "";
    for (const [name, type] of projects) {
      const href = type === "pages"
        ? `/${ACC}/pages/view/${name}`
        : `/${ACC}/workers/services/view/${name}/production`;
      if (CARD_LAYOUT) {
        // Aufbau wie im echten Dashboard: LI > Card > Overlay-Link,
        // dazu ein zweiter Link auf dieselbe Ressource (/deployments)
        const li = document.createElement("li");
        li.className = "min-w-0";
        li.innerHTML =
          `<div class="min-w-0 text-base ring rounded-lg overflow-hidden">` +
            `<div class="relative rounded-lg ring" style="padding:16px;border:1px solid #e5e5e5">` +
              `<a class="absolute inset-0" href="${href}" style="position:absolute;inset:0"></a>` +
              `<span style="font-weight:600">${name}</span>` +
              `<div style="opacity:.6;font-size:12px">${type}</div>` +
              `<a href="${href}/deployments" style="position:relative;font-size:12px">View deployments \u2197</a>` +
            `</div>` +
          `</div>`;
        host.appendChild(li);
      } else if (DIV_LAYOUT) {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;gap:12px;padding:8px;border-bottom:1px solid #eee";
        row.innerHTML = `<a href="${href}">${name}</a><span>${type}</span>`;
        host.appendChild(row);
      } else {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><a href="${href}">${name}</a></td><td>${type}</td><td>vor 2 Tagen</td>`;
        host.appendChild(tr);
      }
    }
  };
  // ?late=N baut die Liste erst nach N ms auf - so verhaelt sich das echte
  // Dashboard beim ersten Laden (React rendert nach dem document_idle der
  // Content-Skripte). Ohne das testet man einen Fall, den es nie gibt.
  const LATE = Number(PARAMS.get("late") || 0);
  if (LATE > 0) setTimeout(() => window.__render(PROJECTS), LATE);
  else window.__render(PROJECTS);

  if (PARAMS.get("open") === "dialog") {
    // Pollen statt feste Wartezeit: unter --virtual-time-budget laufen Timer
    // im Zeitraffer, eine starre Verzoegerung trifft den Moment nicht.
    const tick = setInterval(() => {
      const btn = document.querySelector(".cfwg-toolbar .cfwg-btn-primary");
      if (btn) {
        clearInterval(tick);
        btn.click();
      }
    }, 100);
  }

  // Test-Hook: Reihenfolge inkl. Gruppen-Header auslesen
  window.__order = () =>
    [...host.children].map((el) =>
      el.dataset.cfwg === "header"
        ? "## " + el.querySelector(".cfwg-header-name").textContent +
          " (" + el.querySelector(".cfwg-count").textContent + ")" +
          (el.querySelector(".cfwg-caret-collapsed") ? " [zu]" : "")
        : (el.style.display === "none" ? "- " : "  ") +
          (el.querySelector("span[style]")?.textContent ||
           el.querySelector("a")?.textContent)
    );
</script>

<script src="/_static/src/storage.js"></script>
<script src="/_static/src/api.js"></script>
<script src="/_static/src/dom.js"></script>
<script src="/_static/src/ui.js"></script>
<script src="/_static/src/content.js"></script>
<link rel="stylesheet" href="/_static/src/styles.css" />
