<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Eigenes Motiv, kein Cloudflare-Logo: eine gruppierte Liste (Gruppenpunkt +
    Kopfzeile, darunter eingerueckte Eintraege). Farbwelt orientiert sich an
    Cloudflares Orange-Verlauf.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBAD41"/>
      <stop offset="55%" stop-color="#F6821F"/>
      <stop offset="100%" stop-color="#E4761B"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g fill="#fff">
    <!-- Kopfzeile der Gruppe -->
    <circle cx="33" cy="41" r="8"/>
    <rect x="49" y="33.5" width="52" height="15" rx="7.5"/>

    <!-- Verbinder in die Gruppe hinein -->
    <rect x="30.5" y="57" width="5" height="39" rx="2.5" opacity="0.5"/>

    <!-- Eintraege der Gruppe -->
    <g opacity="0.82">
      <rect x="44" y="62" width="14" height="5" rx="2.5" opacity="0.7"/>
      <rect x="62" y="59.5" width="39" height="13" rx="6.5"/>
      <rect x="44" y="86" width="14" height="5" rx="2.5" opacity="0.7"/>
      <rect x="62" y="83.5" width="39" height="13" rx="6.5"/>
    </g>
  </g>
</svg>
